<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#12181f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bet Tracker"><title>Bet Tracker</title><style>
:root{color-scheme:dark;--bg:#12181f;--card:#1b232c;--line:#2b3640;--text:#f1f5f4;--sub:#9fb0ab;--green:#55c3a7;--red:#f08b86;--gold:#e8a33d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:#25313b;color:var(--text);border:1px solid var(--line);padding:11px 13px;border-radius:10px}button:active{transform:scale(.98)}button.primary{background:var(--gold);color:#241800;border:0;font-weight:750}button:disabled{opacity:.4;cursor:default}main,header{max-width:540px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;padding-top:max(18px,env(safe-area-inset-top));position:sticky;top:0;background:var(--bg);z-index:2}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.5}.muted,small{color:var(--sub);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#23433e,#1b232c)}.big{font-size:34px;font-weight:750;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.value{font-size:22px;font-weight:700;margin-top:8px}.positive{color:var(--green)}.negative{color:var(--red)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:9px 11px}.section{margin:24px 0 12px}.empty{text-align:center;padding:30px 12px;color:var(--sub);line-height:1.6}.badge{font-size:11px;padding:5px 8px;border-radius:7px;background:#273641;white-space:nowrap}.badge.won{color:var(--green)}.badge.lost{color:var(--red)}.badge.pending{color:var(--gold)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#182029;border-top:1px solid var(--line);padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:3}nav button{width:130px;max-width:25%;background:none;border:0;font-size:11px;padding:7px 2px;color:var(--sub)}nav span{display:block;font-size:21px;margin-bottom:3px}nav button.active{color:var(--gold)}main{padding-bottom:110px;padding-top:4px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}input,select{width:100%;min-width:0;background:#222d38;border:1px solid var(--line);color:var(--text);padding:12px 10px;border-radius:9px;font-size:16px}label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}dialog{width:calc(100% - 24px);max-width:510px;max-height:90dvh;border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--bg);color:var(--text)}dialog::backdrop{background:#050a10bd}dialog .head{position:sticky;top:-20px;background:var(--bg);padding:8px 0;z-index:1}.leg{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:14px}.leg .grid{gap:8px}.error{color:var(--red);font-size:13px;line-height:1.4}svg.chart{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;background:#2d5148;padding:12px 18px;border-radius:12px;max-width:90%;box-shadow:0 4px 20px #0008}#splash{position:fixed;inset:0;z-index:30;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse,#23433e,#12181f 65%);transition:opacity .35s}#splash.hidden{opacity:0;pointer-events:none}.logo{width:84px;height:84px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--gold);font-size:40px;animation:enter .6s ease}.spinner{margin:24px auto 12px;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{transform:scale(.8);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.account-name{overflow-wrap:anywhere}#storage-error{padding:12px;background:#542e2e;color:white}a{color:var(--gold)}

#new-bet,#start{background:var(--gold);color:#241800;font-weight:800;border:0;box-shadow:0 4px 16px #e8a33d25}
#start{padding:15px 26px;font-size:16px}
button[data-close],.remove-leg{color:#ff9992;background:#402b30;border-color:#714049}
button[data-delete],button[data-delete-tx]{color:#ff9992;background:#402b30;border-color:#714049}
button[data-settle]{color:#b8ddff;background:#244568;border-color:#386589}
button[data-quick="won"]{background:#214c3d;color:#a1ebc8;border-color:#34775d}
button[data-quick="lost"]{background:#522d32;color:#ffb1ab;border-color:#82434b}
.save-center{display:flex;justify-content:center;margin-top:20px}.save-center button{min-width:200px}
.day-filter{margin-bottom:14px}.day-filter label{margin-top:0}

/* Layout mobile: contenuti entro il viewport e scorrimento solo verticale. */
html{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
header,main,nav,.card,.grid,.filters,.row,.leg,form{min-width:0;max-width:100%}
header{gap:10px}header>div{min-width:0}header h1{font-size:clamp(22px,6vw,27px);overflow-wrap:anywhere}
#new-bet{flex-shrink:0;padding:11px 10px;font-size:14px}
.grid,.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid>*,.filters>*,.row>*{min-width:0}
.card p,.card b,.card span,.value,.big{overflow-wrap:anywhere}
input,select,textarea{box-sizing:border-box;min-width:0;max-width:100%;font-size:16px!important;touch-action:pan-y}
input[type="date"],input[type="datetime-local"]{display:block;width:100%;min-inline-size:0;max-inline-size:100%}
input::-webkit-date-and-time-value{text-align:left;min-width:0}
button,a{touch-action:manipulation}
dialog{box-sizing:border-box;width:calc(100% - 24px);max-width:min(510px,calc(100% - 24px));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
@media(max-width:360px){dialog{padding:14px}.value{font-size:20px}.actions{gap:6px}.actions button{padding:9px 8px}}

.pick-selector{min-width:0}.pick-options{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#17212a}
.pick-options[hidden]{display:none}.pick-options p{margin:0 0 10px}
.pick-head,.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick-head{font-size:11px;color:var(--gold);margin-bottom:8px}.pick-grid{max-height:230px;overflow-y:auto;overscroll-behavior:contain}
.pick-preset{font-size:13px;padding:12px 5px}.pick-preset.selected{border-color:var(--gold);color:var(--gold);background:#3b321f}
.pick-close{width:100%;margin-top:10px;font-size:12px;color:var(--sub)}
</style>
