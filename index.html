<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#12181f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bet Tracker"><title>Bet Tracker</title><style>
:root{color-scheme:dark;--bg:#12181f;--card:#1b232c;--line:#2b3640;--text:#f1f5f4;--sub:#9fb0ab;--green:#55c3a7;--red:#f08b86;--gold:#e8a33d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:#25313b;color:var(--text);border:1px solid var(--line);padding:11px 13px;border-radius:10px}button:active{transform:scale(.98)}button.primary{background:var(--gold);color:#241800;border:0;font-weight:750}button:disabled{opacity:.4;cursor:default}main,header{max-width:540px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;padding-top:max(18px,env(safe-area-inset-top));position:sticky;top:0;background:var(--bg);z-index:2}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.5}.muted,small{color:var(--sub);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#23433e,#1b232c)}.big{font-size:34px;font-weight:750;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.value{font-size:22px;font-weight:700;margin-top:8px}.positive{color:var(--green)}.negative{color:var(--red)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:9px 11px}.section{margin:24px 0 12px}.empty{text-align:center;padding:30px 12px;color:var(--sub);line-height:1.6}.badge{font-size:11px;padding:5px 8px;border-radius:7px;background:#273641;white-space:nowrap}.badge.won{color:var(--green)}.badge.lost{color:var(--red)}.badge.pending{color:var(--gold)}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#182029;border-top:1px solid var(--line);padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:3}nav button{width:130px;max-width:25%;background:none;border:0;font-size:11px;padding:7px 2px;color:var(--sub)}nav span{display:block;font-size:21px;margin-bottom:3px}nav button.active{color:var(--gold)}main{padding-bottom:110px;padding-top:4px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}input,select{width:100%;min-width:0;background:#222d38;border:1px solid var(--line);color:var(--text);padding:12px 10px;border-radius:9px;font-size:16px}label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}dialog{width:calc(100% - 24px);max-width:510px;max-height:90dvh;border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--bg);color:var(--text)}dialog::backdrop{background:#050a10bd}dialog .head{position:sticky;top:-20px;background:var(--bg);padding:8px 0;z-index:1}.leg{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:14px}.leg .grid{gap:8px}.error{color:var(--red);font-size:13px;line-height:1.4}svg.chart{width:100%;height:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;background:#2d5148;padding:12px 18px;border-radius:12px;max-width:90%;box-shadow:0 4px 20px #0008}#splash{position:fixed;inset:0;z-index:30;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse,#23433e,#12181f 65%);transition:opacity .35s}#splash.hidden{opacity:0;pointer-events:none}.logo{width:84px;height:84px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--gold);font-size:40px;animation:enter .6s ease}.spinner{margin:24px auto 12px;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{transform:scale(.8);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.account-name{overflow-wrap:anywhere}#storage-error{padding:12px;background:#542e2e;color:white}a{color:var(--gold)}

#new-bet,#start{background:var(--gold);color:#241800;font-weight:800;border:0;box-shadow:0 4px 16px #e8a33d25}
#start{padding:15px 26px;font-size:16px}
button[data-close],.remove-leg{color:#ff9992;background:#402b30;border-color:#714049}
button[data-delete],button[data-delete-tx]{color:#ff9992;background:#402b30;border-color:#714049}
button[data-settle]{color:#b8ddff;background:#244568;border-color:#386589}
button[data-quick="won"]{background:#214c3d;color:#a1ebc8;border-color:#34775d}
button[data-quick="lost"]{background:#522d32;color:#ffb1ab;border-color:#82434b}
.save-center{display:flex;justify-content:center;margin-top:20px}.save-center button{min-width:200px}
.day-filter{margin-bottom:14px}.day-filter label{margin-top:0}

/* Layout mobile: contenuti entro il viewport e scorrimento solo verticale. */
html{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
header,main,nav,.card,.grid,.filters,.row,.leg,form{min-width:0;max-width:100%}
header{gap:10px}header>div{min-width:0}header h1{font-size:clamp(22px,6vw,27px);overflow-wrap:anywhere}
#new-bet{flex-shrink:0;padding:11px 10px;font-size:14px}
.grid,.filters{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid>*,.filters>*,.row>*{min-width:0}
.card p,.card b,.card span,.value,.big{overflow-wrap:anywhere}
input,select,textarea{box-sizing:border-box;min-width:0;max-width:100%;font-size:16px!important;touch-action:pan-y}
input[type="date"],input[type="datetime-local"]{display:block;width:100%;min-inline-size:0;max-inline-size:100%}
input::-webkit-date-and-time-value{text-align:left;min-width:0}
button,a{touch-action:manipulation}
dialog{box-sizing:border-box;width:calc(100% - 24px);max-width:min(510px,calc(100% - 24px));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
@media(max-width:360px){dialog{padding:14px}.value{font-size:20px}.actions{gap:6px}.actions button{padding:9px 8px}}

.pick-selector{min-width:0}.pick-options{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#17212a}
.pick-options[hidden]{display:none}.pick-options p{margin:0 0 10px}
.pick-head,.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick-head{font-size:11px;color:var(--gold);margin-bottom:8px}.pick-grid{max-height:230px;overflow-y:auto;overscroll-behavior:contain}
.pick-preset{font-size:13px;padding:12px 5px}.pick-preset.selected{border-color:var(--gold);color:var(--gold);background:#3b321f}
.pick-close{width:100%;margin-top:10px;font-size:12px;color:var(--sub)}

</head><body><div id="splash" role="status"><div class="logo">€</div><h1 style="margin-top:18px">Bet Tracker</h1><p class="muted">Il tuo registro delle scommesse</p><div class="spinner"></div><small>Caricamento…</small></div><noscript>Attiva JavaScript per usare l’app.</noscript><div id="storage-error" hidden></div><header><div><small>BET TRACKER</small><h1 id="title">Home</h1></div><button class="primary" id="new-bet" aria-label="Nuova scommessa">＋ Scommessa</button></header><main id="main"></main><nav><button data-tab="home"><span>⌂</span>Home</button><button data-tab="bets"><span>▤</span>Scommesse</button><button data-tab="stats"><span>▥</span>Statistiche</button><button data-tab="accounts"><span>◉</span>Altro</button></nav><dialog id="modal"></dialog>
<script>
'use strict';
// Safari iOS: impedisce il pinch senza interferire con il normale scroll verticale.
document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});
document.addEventListener('gesturechange',event=>event.preventDefault(),{passive:false});
document.addEventListener('touchmove',event=>{if(event.touches.length>1)event.preventDefault();},{passive:false});

const KEY='bet_tracker_v1',main=document.getElementById('main'),modal=document.getElementById('modal');let db={accounts:[],bets:[],transactions:[]},tab='home',period='month',book='all',sport='all',status='all',from='',to='',selectedDay='';
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed.accounts)||!Array.isArray(parsed.bets)||!Array.isArray(parsed.transactions))throw Error();db=parsed;}}catch(e){document.getElementById('storage-error').hidden=false;document.getElementById('storage-error').textContent='Impossibile leggere i dati salvati. Ricarica la pagina prima di inserire nuovi dati.';document.getElementById('new-bet').disabled=true;}
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),round=n=>Math.round((n+Number.EPSILON)*100)/100;
const statuses={pending:'In corso',won:'Vinta',lost:'Persa',void:'Annullata',cashout:'Cash out'};
function odds(b){return b.legs.reduce((n,l)=>n*Number(l.odds),1)}
function payout(b){return b.status==='won'?round(b.stake*odds(b)):b.status==='void'?b.stake:b.status==='cashout'?b.cashout:0}
function profit(b){return b.status==='pending'?0:round(payout(b)-b.stake)}
function balance(a){return round(a.initial+db.transactions.filter(t=>t.account===a.id).reduce((n,t)=>n+t.amount,0)+db.bets.filter(b=>b.account===a.id).reduce((n,b)=>n-b.stake+payout(b),0))}
function accountName(a){return db.accounts.find(x=>x.id===a)?.name||'Conto rimosso'}
function dateLabel(d){return new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function localDate(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function singleAccount(data){const first=data.accounts[0]||{id:'main',name:'Saldo',initial:0};return {...data,accounts:[{...first,name:'Saldo',initial:round(data.accounts.reduce((n,a)=>n+a.initial,0))}],bets:data.bets.map(b=>({...b,account:first.id})),transactions:data.transactions.map(t=>({...t,account:first.id}))};}
if(document.getElementById('storage-error').hidden)db=singleAccount(db);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Salvataggio non riuscito: memoria del browser non disponibile o piena. Esporta un backup da Altro.');return false}}
function commit(next){if(!document.getElementById('storage-error').hidden){alert('Dati salvati non leggibili. Ricarica la pagina prima di modificarli.');return false}const prev=db;db=next;if(!save()){db=prev;return false}render();return true}
function toast(s){const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2500)}
function open(content){modal.innerHTML=content;modal.showModal();modal.querySelector('[data-close]')?.addEventListener('click',()=>modal.close())}
const head=t=>`<div class="row head"><h2>${t}</h2><button type="button" data-close aria-label="Chiudi">✕</button></div>`;
function accountOptions(selected){return db.accounts.map(a=>`<option value="${a.id}" ${selected===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}
function betCard(b){return `<div class="card"><div class="row"><b>${b.legs.length>1?'Multipla · '+b.legs.length+' eventi':'Singola'}</b><span class="badge ${b.status}">${statuses[b.status]}</span></div><p>${b.legs.map(l=>`${esc(l.event)} · ${esc(l.pick)} <small>(${Number(l.odds).toFixed(2)})</small>`).join('<br>')}</p><div class="muted">${dateLabel(b.date)}</div><div class="row wrap" style="margin-top:12px"><span>Puntata <b>${money(b.stake)}</b></span><span>Quota <b>${odds(b).toFixed(2)}</b></span></div><div class="row" style="margin-top:8px"><small>${b.status==='pending'?'Incasso potenziale':'Incasso'}</small><b>${money(b.status==='pending'?round(b.stake*odds(b)):payout(b))}</b></div>${b.status!=='pending'?`<div class="row"><small>Profitto netto</small><b class="${profit(b)<0?'negative':'positive'}">${money(profit(b))}</b></div>`:''}<div class="actions">${b.status==='pending'?`<button data-quick="won" data-bet="${b.id}">✓ Vinta</button><button data-quick="lost" data-bet="${b.id}">✕ Persa</button>`:''}<button data-settle="${b.id}">${b.status==='pending'?'Registra esito':'Modifica esito'}</button><button data-edit="${b.id}">Modifica</button><button data-delete="${b.id}">Elimina</button></div></div>`}
function filtered(){const now=new Date();let start=null,end=null;if(period==='day'&&selectedDay){start=new Date(selectedDay+'T00:00:00');end=new Date(selectedDay+'T23:59:59.999')}if(period==='month')start=new Date(now.getFullYear(),now.getMonth(),1);if(period==='week'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());start.setDate(start.getDate()-(start.getDay()+6)%7)}if(period==='year')start=new Date(now.getFullYear(),0,1);if(period==='custom'){if(from)start=new Date(from+'T00:00:00');if(to)end=new Date(to+'T23:59:59.999')}return db.bets.filter(b=>(!start||new Date(b.date)>=start)&&(!end||new Date(b.date)<=end)&&(tab!=='bets'||status==='all'||b.status===status)).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function filters(){return `<div class="filters"><select id="period" aria-label="Periodo">${[['month','Questo mese'],['day','Giorno selezionato'],['week','Questa settimana'],['year','Quest’anno'],['all','Tutto lo storico'],['custom','Personalizzato']].map(([v,l])=>`<option value="${v}" ${period===v?'selected':''}>${l}</option>`).join('')}</select>${tab==='bets'?`<select id="status" aria-label="Esito"><option value="all">Tutti gli esiti</option>${Object.entries(statuses).map(([v,l])=>`<option value="${v}" ${status===v?'selected':''}>${l}</option>`).join('')}</select>`:''}</div><div class="day-filter"><label for="selected-day">Seleziona un giorno</label><input id="selected-day" type="date" value="${period==='day'?selectedDay:''}"></div>${period==='custom'?`<div class="filters"><div><label>Dal</label><input id="from" type="date" value="${from}"></div><div><label>Al</label><input id="to" type="date" value="${to}"></div></div>`:''}<p class="muted">Periodo riferito alla data della scommessa.</p>`}
function kpis(bets){const closed=bets.filter(b=>b.status!=='pending'),net=closed.reduce((n,b)=>n+profit(b),0),stake=bets.reduce((n,b)=>n+b.stake,0),cs=closed.reduce((n,b)=>n+b.stake,0);return `<div class="grid">${[['Totale puntato',money(stake),''],['Profitto netto',money(net),net<0?'negative':'positive'],['Incassi liquidati',money(closed.reduce((n,b)=>n+payout(b),0)), ''],['Rendimento',cs?(net/cs*100).toFixed(1)+'%':'—','']].map(([l,v,c])=>`<div class="card"><small>${l}</small><div class="value ${c}">${v}</div></div>`).join('')}</div><p class="muted">Rendimento = profitto netto ÷ puntate liquidate × 100. Esempio: 20 € di profitto su 100 € puntati = 20%. Gli incassi includono la puntata restituita.</p>`}
function chart(bets){const closed=bets.filter(b=>b.status!=='pending').sort((a,b)=>new Date(a.settledAt||a.date)-new Date(b.settledAt||b.date));if(!closed.length)return '<div class="empty">Il grafico comparirà dopo il primo esito registrato.</div>';let total=0;const vals=[0,...closed.map(b=>total=round(total+profit(b)))],lo=Math.min(0,...vals),hi=Math.max(1,...vals),y=v=>145-(v-lo)/(hi-lo)*115;return `<svg class="chart" viewBox="0 0 380 180" role="img" aria-label="Profitto cumulato in euro"><line x1="45" x2="360" y1="${y(0)}" y2="${y(0)}" stroke="#55616b"/><text x="0" y="25" fill="#9fb0ab" font-size="11">${hi.toFixed(0)} €</text><text x="0" y="150" fill="#9fb0ab" font-size="11">${lo.toFixed(0)} €</text><polyline points="${vals.map((v,i)=>`${45+i*310/(vals.length-1)},${y(v)}`).join(' ')}" stroke="#55c3a7" stroke-width="3" fill="none"/>${vals.map((v,i)=>`<circle cx="${45+i*310/(vals.length-1)}" cy="${y(v)}" r="4" fill="#e8a33d"><title>${i?dateLabel(closed[i-1].settledAt||closed[i-1].date):'Inizio'}: ${money(v)}</title></circle>`).join('')}<text x="45" y="174" fill="#9fb0ab" font-size="11">Inizio</text><text x="355" y="174" text-anchor="end" fill="#9fb0ab" font-size="11">${closed.length} esiti</text></svg>`}
function render(){document.getElementById('title').textContent={home:'Home',bets:'Scommesse',stats:'Statistiche',accounts:'Altro'}[tab];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='home'){const pending=db.bets.filter(b=>b.status==='pending');html=`<div class="card hero"><small>SALDO DISPONIBILE</small><div class="big">${money(db.accounts.reduce((n,a)=>n+balance(a),0))}</div><div class="muted">${money(pending.reduce((n,b)=>n+b.stake,0))} impegnati · ${pending.length} scommesse aperte</div></div>${kpis(db.bets)}<h2 class="section">Scommesse in corso</h2>${pending.length?pending.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(betCard).join(''):`<div class="card empty">${db.accounts.length?'Non hai scommesse in corso.':'Inizia aggiungendo un conto bookmaker.'}<div class="actions" style="justify-content:center"><button class="primary" id="start">${db.accounts.length?'＋ Scommessa':'＋ Conto'}</button></div></div>`}`}
if(tab==='bets'){const bets=filtered();html=filters()+`<div class="row section"><h2>Storico</h2><small>${bets.length} scommesse</small></div>`+(bets.length?bets.map(betCard).join(''):'<div class="card empty">Nessuna scommessa per questi filtri.</div>')}
if(tab==='stats'){const bets=filtered();html=filters()+kpis(bets)+`<div class="card"><h2>Profitto cumulato</h2>${chart(bets)}<small>Ordine degli esiti. Filtri applicati alle scommesse selezionate.</small></div><div class="card"><h2>Esiti</h2>${Object.entries(statuses).map(([v,l])=>{const n=bets.filter(b=>b.status===v).length;return `<div class="row" style="margin:12px 0"><span>${l}</span><b>${n}</b></div>`}).join('')}</div>`}
if(tab==='accounts'){const a=db.accounts[0];html=`<div class="card hero"><small>SALDO DISPONIBILE</small><div class="big">${money(balance(a))}</div><small>Saldo iniziale ${money(a.initial)}</small><div class="actions"><button data-deposit="${a.id}">Deposita</button><button data-withdraw="${a.id}">Preleva</button></div></div>`+`<h2 class="section">Movimenti</h2>${db.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=>`<div class="card"><div class="row"><b>${t.amount>=0?'Deposito':'Prelievo'}</b><span>${money(t.amount)}</span></div><p class="muted">${dateLabel(t.date)}</p><button data-delete-tx="${t.id}">Elimina movimento</button></div>`).join('')||'<div class="card empty">Nessun deposito o prelievo.</div>'}<div class="card"><h2>Backup</h2><p class="muted">I dati sono salvati solo in questo browser. Esporta un backup per conservarli o trasferirli.</p><div class="actions"><button id="export">Esporta JSON</button><button id="import">Importa JSON</button></div><input hidden type="file" id="import-file" accept="application/json,.json"></div>`}
main.innerHTML=html;bind();}
function bind(){document.getElementById('selected-day')?.addEventListener('change',e=>{selectedDay=e.target.value;period=selectedDay?'day':'all';render()});main.querySelectorAll('[data-quick]').forEach(btn=>btn.onclick=()=>{const b=db.bets.find(b=>b.id===btn.dataset.bet);if(!b)return;const updated={...b,status:btn.dataset.quick,settledAt:new Date().toISOString()};if(commit({...db,bets:db.bets.map(x=>x.id===b.id?updated:x)}))toast('Esito registrato: '+statuses[updated.status]);});document.getElementById('start')?.addEventListener('click',()=>db.accounts.length?betForm():accountForm());document.getElementById('add-account')?.addEventListener('click',()=>accountForm());for(const f of ['period','book','sport','status','from','to'])document.getElementById(f)?.addEventListener('change',e=>{const v=e.target.value;if(f==='period'){period=v;if(v==='day'&&!selectedDay)selectedDay=localDate().slice(0,10);}if(f==='book')book=v;if(f==='sport')sport=v;if(f==='status')status=v;if(f==='from')from=v;if(f==='to')to=v;render()});main.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>betForm(db.bets.find(b=>b.id===e.dataset.edit)));main.querySelectorAll('[data-settle]').forEach(e=>e.onclick=()=>settleForm(db.bets.find(b=>b.id===e.dataset.settle)));main.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{if(confirm('Eliminare questa scommessa? Il saldo sarà ricalcolato.'))commit({...db,bets:db.bets.filter(b=>b.id!==e.dataset.delete)})});main.querySelectorAll('[data-deposit]').forEach(e=>e.onclick=()=>transactionForm(e.dataset.deposit,1));main.querySelectorAll('[data-withdraw]').forEach(e=>e.onclick=()=>transactionForm(e.dataset.withdraw,-1));main.querySelectorAll('[data-rename]').forEach(e=>e.onclick=()=>accountForm(db.accounts.find(a=>a.id===e.dataset.rename)));main.querySelectorAll('[data-delete-tx]').forEach(e=>e.onclick=()=>{if(confirm('Eliminare questo movimento? Il saldo sarà ricalcolato.'))commit({...db,transactions:db.transactions.filter(t=>t.id!==e.dataset.deleteTx)})});document.getElementById('export')?.addEventListener('click',exportData);document.getElementById('import')?.addEventListener('click',()=>document.getElementById('import-file').click());document.getElementById('import-file')?.addEventListener('change',importData)}
function accountForm(a){open(head(a?'Rinomina conto':'Nuovo conto')+`<form id="form"><label>Nome bookmaker</label><input name="name" required maxlength="60" value="${esc(a?.name||'')}" placeholder="Es. Bookmaker personale">${a?'':`<label>Saldo iniziale (€)</label><input name="initial" type="number" min="0" step="0.01" required value="0">`}<p class="error" id="error"></p><button class="primary">Salva conto</button></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim();if(!name||db.accounts.some(x=>x.id!==a?.id&&x.name.toLowerCase()===name.toLowerCase()))return document.getElementById('error').textContent='Inserisci un nome univoco.';const obj=a?{...a,name}:{id:id(),name,initial:Number(f.get('initial'))};if(commit({...db,accounts:a?db.accounts.map(x=>x.id===a.id?obj:x):[...db.accounts,obj]})){modal.close();toast('Conto salvato')}}}
function legHTML(l={}){return `<div class="leg"><div class="row"><b>Evento</b><button type="button" class="remove-leg" aria-label="Rimuovi evento">✕</button></div><label>Partita / evento</label><input class="event" required maxlength="160" value="${esc(l.event||'')}" placeholder="Es. Squadra A – Squadra B"><label>Pronostico</label><div class="pick-selector"><input class="pick" required maxlength="100" value="${esc(l.pick||'')}" placeholder="Scrivi un pronostico o scegli sotto" autocomplete="off" aria-label="Pronostico personalizzato o predefinito" aria-expanded="false"><div class="pick-options" hidden><p class="muted">Scrivi nel campo sopra oppure seleziona un Over.</p><div class="pick-head"><b>HT · Primo tempo</b><b>FT · Partita intera</b></div><div class="pick-grid">${Array.from({length:11},(_,i)=>['HT','FT'].map(period=>`<button type="button" class="pick-preset" data-pick="Over ${i+0.5} ${period}">Over ${i+0.5} ${period}</button>`).join('')).join('')}</div><button type="button" class="pick-close">Chiudi elenco</button></div></div><div><label>Quota decimale</label><input class="odds" type="number" required min="1" max="10000" step="0.001" value="${l.odds||''}"></div></div>`}
function betForm(b){if(!db.accounts.length){accountForm();return}open(head(b?'Modifica scommessa':'Nuova scommessa')+`<form id="form"><div><label>Puntata (€)</label><input name="stake" id="stake" type="number" min="0.01" step="0.01" required value="${b?.stake||''}"></div><label>Data e ora</label><input name="date" type="datetime-local" required value="${localDate(b?new Date(b.date):new Date())}"><div id="legs">${(b?.legs||[{}]).map(legHTML).join('')}</div><div class="actions"><button type="button" id="add-leg">＋ Evento per multipla</button></div><p id="preview" class="muted"></p><p class="error" id="error"></p><div class="save-center"><button class="primary">Salva scommessa</button></div></form>`);
function preview(){const cards=[...modal.querySelectorAll('.leg')],q=cards.reduce((n,c)=>n*Number(c.querySelector('.odds').value||0),1);document.getElementById('preview').textContent=`${cards.length===1?'Singola':'Multipla'} · Quota totale ${Number.isFinite(q)?q.toFixed(2):'—'} · Incasso potenziale ${Number.isFinite(q)?money(Number(document.getElementById('stake').value)*q):'—'}`;cards.forEach(c=>{const input=c.querySelector('.pick'),options=c.querySelector('.pick-options');
const close=()=>{options.hidden=true;input.setAttribute('aria-expanded','false')};
input.onfocus=input.onclick=()=>{modal.querySelectorAll('.pick-options').forEach(x=>x.hidden=true);modal.querySelectorAll('.pick').forEach(x=>x.setAttribute('aria-expanded','false'));options.hidden=false;input.setAttribute('aria-expanded','true')};
input.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}};
c.querySelector('.pick-close').onclick=close;
c.querySelectorAll('[data-pick]').forEach(button=>{button.classList.toggle('selected',button.dataset.pick===input.value);button.onclick=()=>{input.value=button.dataset.pick;preview();close()}});
c.querySelector('.remove-leg').disabled=cards.length===1;c.querySelector('.remove-leg').onclick=()=>{c.remove();preview()}})}document.getElementById('add-leg').onclick=()=>{document.getElementById('legs').insertAdjacentHTML('beforeend',legHTML());preview()};modal.oninput=preview;preview();document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),legs=[...modal.querySelectorAll('.leg')].map(c=>({event:c.querySelector('.event').value.trim(),pick:c.querySelector('.pick').value.trim(),odds:Number(c.querySelector('.odds').value),sport:'Altro'})),obj={...(b||{id:id(),status:'pending'}),account:db.accounts[0].id,stake:Number(f.get('stake')),date:new Date(f.get('date')).toISOString(),legs,note:b?.note||''};if(legs.some(l=>!l.event||!l.pick)||!Number.isFinite(obj.stake*odds(obj))||obj.stake*odds(obj)>1e12)return document.getElementById('error').textContent='Controlla eventi, pronostici e quote.';const a=db.accounts.find(a=>a.id===obj.account),available=balance(a)+(b&&b.account===a.id?b.stake-payout(b):0);if(obj.stake>available&&obj.status==='pending')return document.getElementById('error').textContent='Saldo insufficiente: registra un deposito in Altro.';if(commit({...db,bets:b?db.bets.map(x=>x.id===b.id?obj:x):[...db.bets,obj]})){modal.oninput=null;modal.close();toast('Scommessa salvata')}}}
function settleForm(b){open(head('Esito scommessa')+`<form id="form"><label>Esito</label><select name="status" id="outcome">${Object.entries(statuses).map(([v,l])=>`<option value="${v}" ${b.status===v?'selected':''}>${l}</option>`).join('')}</select><div id="cash-field"><label>Importo incassato con cash out (€)</label><input type="number" name="cashout" min="0" step="0.01" value="${b.cashout||0}"></div><p class="muted">L’incasso comprende la restituzione della puntata. Per una multipla registra l’esito complessivo; se un evento è annullato, modifica la sua quota a 1.</p><button class="primary">Salva esito</button></form>`);const toggle=()=>document.getElementById('cash-field').hidden=document.getElementById('outcome').value!=='cashout';toggle();document.getElementById('outcome').onchange=toggle;document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),status=f.get('status'),obj={...b,status,cashout:Number(f.get('cashout')),settledAt:status==='pending'?null:b.settledAt||new Date().toISOString()};if(commit({...db,bets:db.bets.map(x=>x.id===b.id?obj:x)})){modal.close();toast('Esito aggiornato')}}}
function transactionForm(account,sign){open(head(sign===1?'Deposito':'Prelievo')+`<form id="form"><label>Importo (€)</label><input type="number" name="amount" min="0.01" step="0.01" required><p class="error" id="error"></p><button class="primary">Salva movimento</button></form>`);document.getElementById('form').onsubmit=e=>{e.preventDefault();const amount=Number(new FormData(e.target).get('amount'));if(sign<0&&amount>balance(db.accounts.find(a=>a.id===account)))return document.getElementById('error').textContent='Saldo insufficiente.';if(commit({...db,transactions:[...db.transactions,{id:id(),account,amount:round(sign*amount),date:new Date().toISOString()}]})){modal.close();toast('Movimento salvato')}}}
function exportData(){const blob=new Blob([JSON.stringify({version:1,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bet-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validBackup(d){const finite=n=>typeof n==='number'&&Number.isFinite(n),str=s=>typeof s==='string',validDate=s=>str(s)&&Number.isFinite(Date.parse(s));if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.bets)||!Array.isArray(d.transactions))return false;const safeId=s=>typeof s==='string'&&/^[A-Za-z0-9_-]+$/.test(s);const ids=new Set(d.accounts.map(a=>a.id));return ids.size===d.accounts.length&&d.accounts.every(a=>safeId(a.id)&&str(a.name)&&finite(a.initial)&&a.initial>=0)&&new Set(d.bets.map(b=>b.id)).size===d.bets.length&&d.bets.every(b=>safeId(b.id)&&ids.has(b.account)&&finite(b.stake)&&b.stake>0&&validDate(b.date)&&Object.hasOwn(statuses,b.status)&&Array.isArray(b.legs)&&b.legs.length>0&&b.legs.every(l=>str(l.event)&&str(l.pick)&&str(l.sport)&&finite(l.odds)&&l.odds>=1)&&Number.isFinite(b.stake*odds(b))&&(b.status!=='cashout'||finite(b.cashout)&&b.cashout>=0)&&(!b.settledAt||validDate(b.settledAt))&&(!b.note||str(b.note)))&&new Set(d.transactions.map(t=>t.id)).size===d.transactions.length&&d.transactions.every(t=>safeId(t.id)&&ids.has(t.account)&&finite(t.amount)&&validDate(t.date))}
async function importData(e){const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!validBackup(d))throw Error();if(confirm('Sostituire tutti i dati attuali con questo backup?')){if(commit(singleAccount({accounts:d.accounts,bets:d.bets,transactions:d.transactions}))){book='all';render();toast('Backup importato')}}}catch(err){alert('Backup non valido. I dati attuali non sono stati modificati.')}}
document.getElementById('new-bet').onclick=()=>betForm();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});modal.addEventListener('click',event=>{if(!event.target.closest('.pick-selector')){modal.querySelectorAll('.pick-options').forEach(x=>x.hidden=true);modal.querySelectorAll('.pick').forEach(x=>x.setAttribute('aria-expanded','false'));}});modal.addEventListener('close',()=>modal.oninput=null);render();setTimeout(()=>{document.getElementById('splash').classList.add('hidden');setTimeout(()=>document.getElementById('splash').remove(),400)},900);
</script></body></html>
